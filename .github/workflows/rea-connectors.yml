# Workflow: REA-Connectors — analizar con REA la capa de conectores de una web.
#
# 🛡️ POR QUÉ EXISTE (2026-10-20): queremos saber, con EVIDENCIA y no con
#   rumores, cómo conecta claude.ai con las redes sociales y si hay un camino
#   gratis. Método del proyecto: REA del objetivo -> endpoint real ->
#   reimplementación propia. Este workflow es el "REA del objetivo".
#
#   · Todo el peso ocurre EN LA NUBE (runner público = minutos ilimitados, 0 $).
#     El móvil solo empuja el workflow y baja unos KB de resumen.
#   · NINGÚN SECRETO: sin cookies, sin sesión, sin tokens. Solo páginas públicas.
#   · El netlog se parsea extrayendo SOLO url + método + status + bytes.
#     Nunca cabeceras, cookies ni cuerpos -> no se puede filtrar nada.
#
# USO: Actions -> REA-Connectors -> Run workflow
#      urls  : lista de URLs a visitar (una por línea)
#      origin: origen exacto para el filtro de REA
name: REA-Connectors

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs a analizar (una por linea)"
        required: false
        default: |
          https://claude.com/connectors
          https://claude.com/marketplace/connectors-plugins
        type: string
      origin:
        description: "Origen exacto (filtro de REA)"
        required: false
        default: "https://claude.com"
        type: string
      espera:
        description: "Segundos de espera por URL (hidratacion de la app)"
        required: false
        default: "7"
        type: string

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: procps (REA lo exige para arrancar)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends procps

      - name: Instalar REA
        run: npm install -g rea-agents@6.5.0 --no-audit --no-fund

      - name: Localizar Chrome real (JA3 autentico, no el de Playwright)
        run: |
          set -uo pipefail
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v $c)" >> "$GITHUB_ENV"
              echo "· Chrome: $(command -v $c) — $( "$c" --version 2>/dev/null | head -1)"
              break
            fi
          done
          [ -z "${CHROME_BIN:-}" ] && { echo "::error::no hay Chrome en el runner"; exit 1; }

      - name: Lanzar Chrome con CDP + netlog
        run: |
          set -uo pipefail
          "$CHROME_BIN" \
            --headless=new \
            --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/chrome-profile" \
            --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --blink-settings=imagesEnabled=false \
            --disable-blink-features=AutomationControlled \
            --window-size=1280,900 \
            --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36" \
            --log-net-log="$RUNNER_TEMP/netlog.json" \
            --net-log-capture-mode=Default \
            about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/chrome.pid"
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1 && { echo "· CDP listo"; break; }
            sleep 0.5
          done

      - name: Recorrer las URLs + REA en cada una
        id: paseo
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/salida"
          i=0
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            i=$((i+1))
            echo "══════════ [$i] $URL ══════════"
            TAB=$(curl -s -X PUT "http://127.0.0.1:9222/json/new?$URL" | jq -r '.id // empty')
            if [ -z "$TAB" ]; then echo "  · no se pudo abrir la pestana"; continue; fi
            echo "  · tab=$TAB"
            sleep "${{ inputs.espera }}"

            # target de ESA pestana
            TARGET=$(rea list-browser-targets http://127.0.0.1:9222 --format json 2>/dev/null \
              | jq -r --arg t "$TAB" '[.. | objects | select((.target_id? // "") == $t) | .target_id] | .[0] // empty')
            if [ -z "$TARGET" ]; then
              TARGET=$(rea list-browser-targets http://127.0.0.1:9222 --format json 2>/dev/null \
                | jq -r '[.. | objects | to_entries[]? | select(.key|test("target_?[Ii]d")) | .value] | map(select(type=="string")) | .[0] // empty')
            fi
            echo "  · TARGET_ID=$TARGET"
            [ -z "$TARGET" ] && continue

            rea analyze-web-bundle http://127.0.0.1:9222 "$TARGET" \
              --allowed-origins "${{ inputs.origin }}" --observation-ms 3000 \
              --format json > "$RUNNER_TEMP/salida/bundle-$i.json" 2> "$RUNNER_TEMP/salida/bundle-$i.err" || true
            echo "  · bundle-$i.json: $(wc -c < "$RUNNER_TEMP/salida/bundle-$i.json") bytes"
            echo "  · evidence_id: $(jq -r '.evidence_id // "?"' "$RUNNER_TEMP/salida/bundle-$i.json" 2>/dev/null)"
            echo "  · target_url: $(jq -r '.normalized_result.capture.target_url // "?"' "$RUNNER_TEMP/salida/bundle-$i.json" 2>/dev/null)"
            echo "  · scripts: $(jq -r '.normalized_result.capture.scripts_observed // "?"' "$RUNNER_TEMP/salida/bundle-$i.json" 2>/dev/null)"

            rea discover-webmcp-tools http://127.0.0.1:9222 "$TARGET" \
              --allowed-origins "${{ inputs.origin }}" --format json \
              > "$RUNNER_TEMP/salida/webmcp-$i.json" 2>/dev/null || true
            echo "  · webmcp tools: $(jq -r '.normalized_result.tools.total // "?"' "$RUNNER_TEMP/salida/webmcp-$i.json" 2>/dev/null)"
            jq -r '.normalized_result.tools.items[]? | "      · \(.name) — \(.description // "" | .[0:110])"' "$RUNNER_TEMP/salida/webmcp-$i.json" 2>/dev/null | head -30
          done <<< "${{ inputs.urls }}"
          echo "VISITADAS=$i" >> "$GITHUB_ENV"

      - name: Cerrar Chrome (vacia el netlog a disco)
        # Chrome solo escribe el netlog final al salir de forma ordenada.
        run: |
          set -uo pipefail
          kill -TERM "$(cat "$RUNNER_TEMP/chrome.pid")" 2>/dev/null || true
          for i in $(seq 1 20); do
            kill -0 "$(cat "$RUNNER_TEMP/chrome.pid")" 2>/dev/null || break
            sleep 0.5
          done
          echo "· netlog: $(wc -c < "$RUNNER_TEMP/netlog.json" 2>/dev/null || echo 0) bytes"

      - name: Extraer endpoints del netlog (SOLO url/metodo/bytes)
        run: |
          set -uo pipefail
          jq -r '
            [ .events[]
              | select(.type == "URL_REQUEST_JOB_FILTERED" or .type == "URL_REQUEST_JOB")
              | select(.phase == "START" or .phase == "INITIATE" or .phase == null)
              | .params as $p
              | { url: $p.url, method: ($p.method // "?"), id: $p.request_id } ] as $reqs
            | [ .events[]
              | select(.type == "URL_REQUEST_JOB_BYTES_READ" or .type == "URL_REQUEST_JOB_BYTES_SENT")
              | { id: .params.request_id, bytes: (.params.byte_count // 0) } ]
            | reduce .[] as $b ({}; .[$b.id] = (.[$b.id] // 0) + ($b.bytes // 0))
            | . as $bytes
            | $reqs | unique_by(.id)
            | map({ url, method, bytes: ($bytes[.id] // 0) })
            | sort_by(.url)
          ' "$RUNNER_TEMP/netlog.json" > "$RUNNER_TEMP/endpoints.json" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/endpoints.json"

          N=$(jq 'length' "$RUNNER_TEMP/endpoints.json")
          echo "· requests distintos: $N"
          echo "· bytes totales: $(jq '[.[].bytes]|add // 0' "$RUNNER_TEMP/endpoints.json")"
          echo
          echo "── Candidatos a API (api|directory|connector|mcp|graphql|search|anthropic) ──"
          jq -r '.[] | select(.url|test("api|directory|connector|mcp|graphql|search|anthropic|marketplace";"i")) | "\(.method)\t\(.bytes)\t\(.url)"' "$RUNNER_TEMP/endpoints.json" | sort -u | head -60
          echo
          echo "── Todos los hosts contacted ──"
          jq -r '.[].url' "$RUNNER_TEMP/endpoints.json" | sed -E 's#^(https?://[^/]+).*#\1#' | sort | uniq -c | sort -rn | head -30

      - name: Rastrear endpoints dentro del bundle (strings con forma de ruta)
        run: |
          set -uo pipefail
          for f in "$RUNNER_TEMP"/salida/bundle-*.json; do
            [ -f "$f" ] || continue
            echo "── $(basename "$f") ──"
            jq -r '.. | strings' "$f" 2>/dev/null \
              | grep -oE '"/(api|_next|graphql|v[0-9])[A-Za-z0-9_./{}:-]*"' \
              | sort -u | head -40
          done

      - name: Subir la evidencia (KB, no MB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-connectors-evidencia
          path: |
            ${{ runner.temp }}/endpoints.json
            ${{ runner.temp }}/salida/
          retention-days: 30
