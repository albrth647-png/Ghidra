# Workflow de AUDITORÍA: descarga una app desde una release de GitHub,
# la analiza con REA (JS/Electron) + Ghidra (nativo) y sube solo la evidencia.
#
# Diseñado para la Fase 0 del PLAN-EJECUCION: el pesado ocurre en la nube,
# el móvil solo empuja este workflow y baja unos KB de evidencia.
#
# USO:
#   Actions -> REA-Audit -> Run workflow
#     app_nombre : drawio
#     asset_url  : https://github.com/.../drawio-amd64-32.4.1.deb
#     sha256_url : https://github.com/.../Files-SHA256-Hashes.txt   (opcional)
name: REA-Audit

on:
  workflow_dispatch:
    inputs:
      app_nombre:
        description: "Nombre corto de la app (ej: drawio)"
        required: true
        type: string
      asset_url:
        description: "URL completa del asset a descargar (release de GitHub)"
        required: true
        type: string
      sha256_url:
        description: "URL opcional del fichero de hashes oficiales (verificación)"
        required: false
        default: ""
        type: string
      analizar_nativo:
        description: "¿Ejecutar Ghidra sobre el binario nativo? (true/false)"
        required: false
        default: "true"
        type: string
      analizar_asar_completo:
        description: "true = analizar todo el asar (inventario amplio) · false = solo proceso main (vectores Electron)"
        required: false
        default: "false"
        type: string
      rea_max_heap_mb:
        description: "Heap máximo por fichero JS (MiB). 1024 se agota con bundles minificados; el runner tiene 16 GB"
        required: false
        default: "6144"
        type: string
      rea_timeout_ms:
        description: "Timeout por fichero JS (ms)"
        required: false
        default: "900000"
        type: string
      js_target_rel:
        description: "Ruta concreta dentro del asar (ej: dist/main.js). Vacío = dir del entrypoint main"
        required: false
        default: ""
        type: string

jobs:
  auditar:
    runs-on: ubuntu-latest        # x86_64 -> decompiler Ghidra linux_x86_64 válido
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------
      # 0. Checkout (sin esto el workspace está vacío)
      # ---------------------------------------------------------------
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. Requisitos
      # ---------------------------------------------------------------
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JDK 21 (Ghidra 12.1.x lo exige)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: procps + herramientas de extracción
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends procps binutils xz-utils unzip

      # ---------------------------------------------------------------
      # 2. REA (cacheado)
      # ---------------------------------------------------------------
      - name: Cache npm (REA)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-rea-6.5.0

      - name: Instalar REA
        run: npm install -g rea-agents@6.5.0 --no-audit --no-fund

      # ---------------------------------------------------------------
      # 3. Ghidra 12.1.4 (descarga verificada por SHA-256)
      # ---------------------------------------------------------------
      - name: Cache Ghidra
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-12.1.4-ddac49f9

      - name: Instalar Ghidra 12.1.4
        run: |
          if [ ! -d "$HOME/ghidra" ]; then
            curl -fSL --retry 3 -o "$RUNNER_TEMP/ghidra.zip" \
              "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
            echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" \
              | sha256sum -c -
            unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$HOME"
            mv "$HOME"/ghidra_12.1.4_PUBLIC "$HOME/ghidra"
            rm -f "$RUNNER_TEMP/ghidra.zip"
          fi
          "$HOME/ghidra/support/analyzeHeadless" 2>&1 | head -2 || true

      # ---------------------------------------------------------------
      # 4. Descargar la app (EN LA NUBE — no gasta datos del móvil)
      # ---------------------------------------------------------------
      - name: Descargar y verificar el asset
        env:
          ASSET_URL: ${{ inputs.asset_url }}
          SHA256_URL: ${{ inputs.sha256_url }}
          APP: ${{ inputs.app_nombre }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/extraido"
          curl -fSL --retry 3 -A "rea-audit" -o "$RUNNER_TEMP/app/asset" "$ASSET_URL"

          echo "--- identidad real del asset (por contenido, no por extensión) ---"
          file "$RUNNER_TEMP/app/asset"
          echo "--- sha256 del asset ---"
          sha256sum "$RUNNER_TEMP/app/asset" | tee "$RUNNER_TEMP/app/asset.sha256"

          if [ -n "${SHA256_URL:-}" ]; then
            echo "--- verificando contra el hash oficial del proyecto ---"
            curl -fSL --retry 3 -o "$RUNNER_TEMP/app/oficial.sha256" "$SHA256_URL" || true
            if [ -s "$RUNNER_TEMP/app/oficial.sha256" ]; then
              H=$(sha256sum "$RUNNER_TEMP/app/asset" | cut -d' ' -f1 | tr 'A-F' 'a-f')
              if grep -qi "$H" "$RUNNER_TEMP/app/oficial.sha256"; then
                echo "VERIFICADO: el hash coincide con el publicado por el proyecto"
                echo "sha256_verificado=true" >> "$GITHUB_ENV"
              else
                echo "AVISO: el hash NO aparece en el fichero oficial"
                echo "sha256_verificado=false" >> "$GITHUB_ENV"
              fi
            fi
          else
            echo "sha256_verificado=no_disponible" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------------
      # 5. Extraer (soporta .deb, .zip, .tar.*, .asar plano)
      # ---------------------------------------------------------------
      - name: Extraer el paquete
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/extraido"
          F="$RUNNER_TEMP/app/asset"
          case "$(file -b "$F")" in
            *Debian*|*"package"*|*compressed*)
              if file -b "$F" | grep -qi debian; then
                ar x "$F" 2>/dev/null || true
                for d in data.tar.*; do
                  [ -e "$d" ] && tar -xf "$d" && rm -f "$d"
                done
                rm -f control.tar.* debian-binary 2>/dev/null || true
              elif unzip -t "$F" >/dev/null 2>&1; then
                unzip -q "$F"
              else
                tar -xf "$F"
              fi
              ;;
            *)
              if unzip -t "$F" >/dev/null 2>&1; then unzip -q "$F"; else tar -xf "$F" || cp "$F" ./asset.bin; fi
              ;;
          esac
          echo "--- estructura extraída (top) ---"
          find . -maxdepth 3 -type d | head -30
          echo "--- localizando app.asar / package.json ---"
          find . \( -name "*.asar" -o -name "package.json" \) -not -path "*/node_modules/*" 2>/dev/null | head -20
          echo "--- binarios nativos principales ---"
          find . -type f -perm -u+x -size +1M 2>/dev/null | head -10

      # ---------------------------------------------------------------
      # 5b. Extraer asar → package.json (deps con versión) + SBOM + main
      # ---------------------------------------------------------------
      - name: Extraer asar (SBOM + proceso main)
        env:
          JS_TARGET_REL: ${{ inputs.js_target_rel }}
        run: |
          set -uo pipefail
          ASAR=$(find "$RUNNER_TEMP/extraido" -name "*.asar" 2>/dev/null | head -1)
          if [ -z "$ASAR" ]; then
            echo "No hay asar — se conserva la estrategia de descubrimiento genérico."
            echo "asar_extraido=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "asar: $ASAR"
          npx --yes @electron/asar extract "$ASAR" "$RUNNER_TEMP/asar_x" >/dev/null 2>&1 || {
            echo "No se pudo extraer el asar (se analiza tal cual)."
            echo "asar_extraido=false" >> "$GITHUB_ENV"; exit 0;
          }
          echo "asar_extraido=true" >> "$GITHUB_ENV"

          # --- package.json del proyecto (nombre, versión, main, deps) ---
          if [ -f "$RUNNER_TEMP/asar_x/package.json" ]; then
            cp "$RUNNER_TEMP/asar_x/package.json" "$RUNNER_TEMP/package-proyecto.json"
            echo "--- package.json del proyecto ---"
            jq -r '"app: \(.name)@\(.version)  main: \(.main // "n/d")"' "$RUNNER_TEMP/package-proyecto.json" || true
            echo "deps directas: $(jq '(.dependencies // {}) | length' "$RUNNER_TEMP/package-proyecto.json" 2>/dev/null || echo 0)"
            echo "devDeps: $(jq '(.devDependencies // {}) | length' "$RUNNER_TEMP/package-proyecto.json" 2>/dev/null || echo 0)"
          fi

          # --- SBOM: name@version de cada manifiesto node_modules empaquetado ---
          (
            cd "$RUNNER_TEMP/asar_x" || exit 0
            find node_modules -maxdepth 5 -name package.json -type f 2>/dev/null | while read -r f; do
              n=$(jq -r '.name // empty' "$f" 2>/dev/null)
              v=$(jq -r '.version // empty' "$f" 2>/dev/null)
              [ -n "$n" ] && echo "$n@$v"
            done | sort -u > "$RUNNER_TEMP/sbom.txt"
          ) || true
          echo "SBOM: $(wc -l < "$RUNNER_TEMP/sbom.txt" 2>/dev/null || echo 0) paquetes con versión"
          head -15 "$RUNNER_TEMP/sbom.txt" 2>/dev/null || true

          # --- objetivo JS: dir del entrypoint main (proceso main, sin bundles) ---
          if [ "${{ inputs.analizar_asar_completo }}" != "true" ]; then
            MAIN=$(jq -r '.main // empty' "$RUNNER_TEMP/asar_x/package.json" 2>/dev/null | sed 's|^\./||')
            if [ -n "$MAIN" ] && [ -f "$RUNNER_TEMP/asar_x/$MAIN" ]; then
              D=$(dirname "$MAIN")
              echo "js_target_override=$RUNNER_TEMP/asar_x/$D" >> "$GITHUB_ENV"
              echo "entrypoint main: $MAIN → objetivo: asar_x/$D"
            else
              echo "No se resolvió el main (se usará el asar completo o el descubrimiento)."
              jq -r '.main // "SIN CAMPO main"' "$RUNNER_TEMP/asar_x/package.json" 2>/dev/null || true
            fi
          fi

          # --- override explícito: un fichero o subruta concreta dentro del asar ---
          # (un bundle minificado grande agota el heap/tiempo si se analiza el dir entero)
          if [ -n "${JS_TARGET_REL:-}" ]; then
            CAND="$RUNNER_TEMP/asar_x/$JS_TARGET_REL"
            if [ -f "$CAND" ] || [ -d "$CAND" ]; then
              echo "js_target_override=$CAND" >> "$GITHUB_ENV"
              echo "objetivo JS por input: $JS_TARGET_REL"
            else
              echo "AVISO: js_target_rel no existe en el asar: $JS_TARGET_REL"
            fi
          fi

      # ---------------------------------------------------------------
      # 6. Análisis JS/Electron  ← ESTA ES LA OFERTA DE 150 USDT
      # ---------------------------------------------------------------
      - name: Análisis JS/Electron con REA
        env:
          REA_MAX_HEAP_MB: ${{ inputs.rea_max_heap_mb }}
          REA_TIMEOUT_MS: ${{ inputs.rea_timeout_ms }}
        run: |
          set -euo pipefail
          # elegir objetivo: override (proceso main) > asar > dir con package.json > raíz
          TARGET="${js_target_override:-}"
          if [ -z "$TARGET" ]; then
            TARGET=$(find "$RUNNER_TEMP/extraido" -name "*.asar" 2>/dev/null | head -1)
          fi
          if [ -z "$TARGET" ]; then
            TARGET=$(find "$RUNNER_TEMP/extraido" -name "package.json" -not -path "*/node_modules/*" 2>/dev/null | head -1 | xargs -r dirname)
          fi
          if [ -z "$TARGET" ]; then
            TARGET="$RUNNER_TEMP/extraido"
          fi
          echo "objetivo JS: $TARGET"
          if [ -f "$TARGET" ]; then
            # REA solo acepta un directorio o un .asar. Para analizar UN fichero
            # (bundle minificado grande) se apunta al directorio que lo contiene.
            mkdir -p "$RUNNER_TEMP/jsdir" && cp "$TARGET" "$RUNNER_TEMP/jsdir/"
            TARGET="$RUNNER_TEMP/jsdir"
          fi

          # Heap: el default (1 GiB) se agota con bundles minificados grandes
          # (Beekeeper 6.1.6: main.js, renderer/assets/index-*.js y utility.js).
          # El runner tiene 16 GB, así que 6 GiB es seguro. Configurable por input.
          rea analyze-javascript-application "$TARGET" --json \
            --max-heap-mb "${REA_MAX_HEAP_MB:-6144}" \
            --analysis-timeout-ms "${REA_TIMEOUT_MS:-900000}" \
            > "$RUNNER_TEMP/evidencia-js.json" || echo "js_exit=$?" >> "$GITHUB_ENV"

          echo "--- tamaño evidencia JS ---"
          wc -c "$RUNNER_TEMP/evidencia-js.json" 2>/dev/null || true
          python3 -c "
          import json,sys
          try:
              d=json.load(open('$RUNNER_TEMP/evidencia-js.json'))
          except Exception as e:
              print('no se pudo parsear:',e); sys.exit(0)
          print('evidence_id:', d.get('evidence_id'))
          print('operacion  :', d.get('operation'))
          print('confianza  :', d.get('confidence'))
          print('limitaciones:', len(d.get('limitations',[])))
          nr=d.get('normalized_result') or {}
          if isinstance(nr,dict):
              print('claves:', list(nr.keys())[:20])
          " || true

      # ---------------------------------------------------------------
      # 7. Análisis NATIVO con Ghidra (Cara 2 / bonus)
      # ---------------------------------------------------------------
      - name: Análisis nativo con Ghidra
        env:
          GHIDRA_INSTALL_DIR: /home/runner/ghidra
          REA_GHIDRA_STARTUP_TIMEOUT_MS: '1200000'
          ANALIZAR_NATIVO: ${{ inputs.analizar_nativo }}
        run: |
          set -uo pipefail
          if [ "${ANALIZAR_NATIVO:-true}" != "true" ]; then
            echo "Ghidra omitido por input (analizar_nativo=false) — ya existe evidencia nativa de un run previo."
            echo "ghidra_omitido=input_false" >> "$GITHUB_ENV"
            exit 0
          fi
          BIN=$(find "$RUNNER_TEMP/extraido" -type f -perm -u+x -size +1M 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "No se encontró binario nativo — se omite Ghidra."
            echo "ghidra_omitido=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "binario nativo: $BIN"
          file "$BIN"
          sha256sum "$BIN"
          rea analyze "$BIN" --provider ghidra --json \
            > "$RUNNER_TEMP/evidencia-nativa.json" || echo "native_exit=$?" >> "$GITHUB_ENV"
          echo "--- tamaño evidencia nativa ---"
          wc -c "$RUNNER_TEMP/evidencia-nativa.json" 2>/dev/null || true

      # ---------------------------------------------------------------
      # 8. Resumen unificado
      # ---------------------------------------------------------------
      - name: Resumen de la auditoría
        env:
          APP: ${{ inputs.app_nombre }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          out = {"app": os.environ.get("APP",""), "archivos": {}, "sha256_verificado": os.environ.get("sha256_verificado","")}
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          for nombre in ("evidencia-js.json","evidencia-nativa.json"):
              p = tmp / nombre
              if not p.exists():
                  out["archivos"][nombre] = "ausente"; continue
              try:
                  d = json.loads(p.read_text())
                  norm = d.get("normalized_result") or {}
                  sem = norm.get("semantic_graph") or {}
                  cov = sem.get("coverage") or {}
                  lims = d.get("limitations", [])
                  out["archivos"][nombre] = {
                      "evidence_id": d.get("evidence_id"),
                      "operation": d.get("operation"),
                      "confidence": d.get("confidence"),
                      "limitaciones": len(lims),
                      "bytes": p.stat().st_size,
                      "cobertura": cov.get("status"),
                      "truncado": cov.get("truncated"),
                      "recursos_agotados": [l.split(":")[0] for l in lims if "Resource constraint" in l],
                      "resumen": norm.get("summary"),
                  }
              except Exception as e:
                  out["archivos"][nombre] = f"error: {e}"
          (tmp / "resumen-auditoria.json").write_text(json.dumps(out, indent=2, ensure_ascii=False))
          print(json.dumps(out, indent=2, ensure_ascii=False))
          PY

      # ---------------------------------------------------------------
      # 9. Subir evidencia (siempre, aunque algo falle)
      # ---------------------------------------------------------------
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-auditoria-${{ inputs.app_nombre }}
          path: |
            ${{ runner.temp }}/evidencia-js.json
            ${{ runner.temp }}/evidencia-nativa.json
            ${{ runner.temp }}/resumen-auditoria.json
            ${{ runner.temp }}/sbom.txt
            ${{ runner.temp }}/package-proyecto.json
            ${{ runner.temp }}/app/asset.sha256
          retention-days: 14
          if-no-files-found: warn
