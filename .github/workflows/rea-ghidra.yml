# Workflow parametrizado: analiza cualquier binario que subas al repo.
#
# USO:
#   1. Coloca tu binario en la carpeta objetivos/  (SOLO si es tuyo,
#      publico, o tienes autorizacion escrita + NDA)
#   2. git push
#   3. Actions -> REA-Ghidra -> Run workflow -> rellenar 'objetivo'
#   4. Descarga el artifact 'rea-evidencia'
name: REA-Ghidra

on:
  workflow_dispatch:
    inputs:
      objetivo:
        description: "Ruta del binario dentro del repo (ej: objetivos/miapp)"
        required: true
        type: string
      detalle:
        description: "Nivel de detalle de la Evidence"
        required: false
        default: "summary"
        type: choice
        options:
          - summary
          - complete

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: procps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends procps

      - name: Cachear Ghidra
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-12.1.4-ddac49f9

      - name: Instalar Ghidra 12.1.4
        run: |
          if [ ! -d "$HOME/ghidra" ]; then
            curl -fsSL -o "$RUNNER_TEMP/ghidra.zip" \
              "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
            echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" \
              | sha256sum -c -
            unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$HOME"
            mv "$HOME"/ghidra_12.1.4_PUBLIC "$HOME/ghidra"
            rm -f "$RUNNER_TEMP/ghidra.zip"
          fi

      - name: Instalar REA
        run: npm install -g rea-agents --no-audit --no-fund

      - name: Verificar Ghidra con REA
        env:
          GHIDRA_INSTALL_DIR: /home/runner/ghidra
        run: set -o pipefail && rea doctor --provider ghidra --json > "$RUNNER_TEMP/doctor.json"

      - name: Identidad del objetivo
        run: |
          OBJ="$GITHUB_WORKSPACE/${{ inputs.objetivo }}"
          if [ ! -f "$OBJ" ]; then
            echo "ERROR: no existe el objetivo: $OBJ"
            echo "Subelo primero a la ruta indicada."
            exit 1
          fi
          file "$OBJ"
          sha256sum "$OBJ"
          ls -la "$OBJ"

      - name: Analizar
        env:
          GHIDRA_INSTALL_DIR: /home/runner/ghidra
          REA_GHIDRA_STARTUP_TIMEOUT_MS: '1200000'
        run: |
          set -o pipefail
          rea analyze "$GITHUB_WORKSPACE/${{ inputs.objetivo }}" \
            --provider ghidra --json > "$RUNNER_TEMP/evidencia.json"
          wc -c "$RUNNER_TEMP/evidencia.json"

      - name: Subir Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-evidencia
          path: ${{ runner.temp }}/evidencia.json
          retention-days: 7
          if-no-files-found: warn
